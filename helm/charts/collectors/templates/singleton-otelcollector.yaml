{{- if eq .Values.singleton.enabled true -}}
{{- $teams := include "singletonTeamConfig" . | fromYaml }}
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: {{ include "nrotel.singletonName" . }}
  namespace: {{ .Release.Namespace }}
spec:

  # Mode
  mode: "deployment"

  # Replicas -> SHOULD BE 1 (obviously...)
  replicas: 1

  # Service Account
  serviceAccount: {{ include "nrotel.singletonName" . }}

  # Security context for container priviliges
  {{- with .Values.singleton.securityContext }}
  securityContext: {{ toYaml . | nindent 4 }}
  {{- end }}

  # Annotations for the pods
  podAnnotations:
    prometheus.io/scrape: "false" # This should be false by default. Otherwise 'otelcollector' self scraper job AND 'kubernetes-pods' scrape job will both scrape
  {{- range $key, $val := .Values.singleton.annotations }}
    {{ $key }}: {{ $val }}
  {{- end }}

  # Ports to expose per service
  ports:
    - name: prometheus
      protocol: TCP
      port: {{ .Values.singleton.ports.prometheus.port }}
      targetPort: {{ .Values.singleton.ports.prometheus.targetPort }}

  # Image
  image: "{{ .Values.singleton.image.repository }}:{{ include "nrotel.singletonImageTag" . }}"
  imagePullPolicy: {{ .Values.singleton.image.pullPolicy }}

  # Resources
  resources:
    requests:
      cpu: {{ .Values.singleton.resources.requests.cpu }}
      memory: {{ .Values.singleton.resources.requests.memory }}
    limits:
      cpu: {{ .Values.singleton.resources.limits.cpu }}
      memory: {{ .Values.singleton.resources.limits.memory }}

  # Environment variables
  env:
    - name: MY_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: MY_POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: MY_POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
  {{- range $teamName, $teamInfo := $teams }}
      {{- if ne $teamInfo.ignore true }}
    - name: {{ $teamName }}_endpoint
      value: {{ $teamInfo.endpoint }}
        {{- if $teamInfo.licenseKey.secretRef }}
    - name: {{ $teamName }}_licenseKey
      valueFrom:
        secretKeyRef:
          name: {{ $teamInfo.licenseKey.secretRef.name }}
          key: {{ $teamInfo.licenseKey.secretRef.key }}
        {{- else if $teamInfo.licenseKey.value }}
    - name: {{ $teamName }}_licenseKey
      valueFrom:
        secretKeyRef:
          name: {{ include "nrotel.singletonName" $ }}-{{ $teamName }}
          key: licenseKey
        {{- end }}
      {{- end }}
    {{- end }}

  # Otel configuration
  config:
    receivers:
      prometheus/self:
        config:
          scrape_configs:
            - job_name: 'otelcollector'
              scrape_interval: {{ .Values.singleton.prometheus.self.scrapeInterval }}
              static_configs:
              - targets:
                - 127.0.0.1:{{ .Values.singleton.ports.prometheus.port }}
              {{- if ne (len .Values.singleton.prometheus.self.importantMetrics) 0 }}
                {{ $metrics := "" -}}
                {{- range $index, $metric := .Values.singleton.prometheus.self.importantMetrics -}}
                  {{- if eq $index 0 -}}
                    {{- $metrics = printf "%s" $metric -}}
                  {{ else }}
                    {{- $metrics = printf "%s|%s" $metrics $metric -}}
                  {{- end -}}
                {{- end }}
              metric_relabel_configs:
                - source_labels: [__name__]
                  separator: ;
                  regex: {{ $metrics }}
                  replacement: $$1
                  action: keep
              {{- end }}

      k8s_events: {}

      k8s_cluster:
        collection_interval: 30s
        node_conditions_to_report: [Ready, DiskPressure, MemoryPressure, PIDPressure, NetworkUnavailable]
        allocatable_types_to_report: [cpu, memory]
        distribution: kubernetes
        metrics:
          k8s.node.condition:
            enabled: true
          k8s.pod.status_reason:
            enabled: true

    processors:
      transform/prepare:
        metric_statements:
          - statements:
              # copy service.name to scraper.job to replace filtering functionality
              - set(resource.attributes["scraper.job"], resource.attributes["service.name"])
              # Delete atributes added by prometheus-receiver so that k8s_attributes processor can re-add them.
              # See https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/41139
              - delete_key(resource.attributes, "service.name")
              - delete_key(resource.attributes, "service.namespace")
              - delete_key(resource.attributes, "service.version")
              - delete_key(resource.attributes, "service.instance.id")

      k8s_attributes:
        extract:

          metadata:
          - k8s.namespace.name
          - k8s.deployment.name
          - k8s.statefulset.name
          - k8s.daemonset.name
          - k8s.cronjob.name
          - k8s.job.name
          - k8s.node.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.pod.start_time
          - service.namespace
          - service.name
          - service.version
          - service.instance.id
        passthrough: false
        pod_association:
        - sources:
          - from: resource_attribute
            name: k8s.pod.ip
        - sources:
          - from: resource_attribute
            name: k8s.pod.uid
        - sources:
          - from: connection

      attributes:
        actions:
          - key: k8s.cluster.name
            value: {{ .Values.clusterName }}
            action: upsert
      attributes/self:
        actions:
          - key: otelcollector.type
            value: singleton
            action: upsert
          - key: k8s.node.name
            value: ${MY_NODE_NAME}
            action: upsert
          - key: k8s.namespace.name
            value: ${MY_POD_NAMESPACE}
            action: upsert
          - key: k8s.pod.name
            value: ${MY_POD_NAME}
            action: upsert

      memory_limiter:
         check_interval: 1s
         limit_percentage: 80
         spike_limit_percentage: 25

      batch:
        send_batch_max_size: 1000
        timeout: 30s
        send_batch_size : 800

    exporters:

      {{- range $teamName, $teamInfo := $teams }}
        {{- if ne $teamInfo.ignore true }}
      otlp_http/{{ $teamName }}:
        endpoint: {{ "${" }}{{ $teamName }}_endpoint}
        tls:
          insecure: false
        headers:
          api-key: {{ "${" }}{{ $teamName }}_licenseKey}
        {{- end }}
      {{- end }}
    
      debug:
        verbosity: detailed

    connectors:
      routing/logs:
        # ???
        default_pipelines: logs/debug
        table:
      {{- range $teamName, $teamInfo := $teams }}
        {{- if and (ne $teamInfo.ignore true) (ne (len $teamInfo.namespaces) 0) }}
          - context: log
            condition: {{ $teamInfo.filter }}
            pipelines:
              - logs/{{ $teamName }}
        {{- end }}
      {{- end }}


    service:
      pipelines:
        metrics/self:
          receivers:
            - prometheus/self
          processors:
            - memory_limiter
            - transform/prepare
            - k8s_attributes
            - attributes
            - attributes/self
            - batch
          exporters:
            - otlp_http/opsteam
            # - logging
        metrics/k8scluster:
          receivers:
            - k8s_cluster
          processors:
            - memory_limiter
            - transform/prepare
            - k8s_attributes
            - attributes
            - batch
          exporters:
            - otlp_http/opsteam

        logs/ingest:
          receivers:
            - k8s_events
          processors:
            - memory_limiter
            - attributes
          exporters:
            - routing/logs
        {{- range $teamName, $teamInfo := $teams }}
          {{- if ne $teamInfo.ignore true }}
        logs/{{ $teamName }}:
          receivers:
            - routing/logs
          processors:
            - batch
          exporters:
            - otlp_http/{{ $teamName }}
            # - logging
          {{- end }}
        {{- end }}
        logs/debug:
          receivers:
            - routing/logs
          processors:
            - batch
          exporters:
            - debug


{{- end -}}
