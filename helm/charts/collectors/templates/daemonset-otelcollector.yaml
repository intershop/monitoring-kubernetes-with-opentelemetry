{{- if eq .Values.daemonset.enabled true -}}
{{- $teams := include "daemonsetTeamConfig" . | fromYaml }}
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: {{ include "nrotel.daemonsetName" . }}
  namespace: {{ .Release.Namespace }}
spec:

  # Mode
  mode: "daemonset"

  # Service Account
  serviceAccount: {{ include "nrotel.daemonsetName" . }}

  # Security context for container priviliges
  {{- with .Values.daemonset.securityContext }}
  securityContext: {{ toYaml . | nindent 4 }}
  {{- end }}

  # Annotations for the pods
  podAnnotations:
    prometheus.io/scrape: "false" # This should be false by default. Otherwise 'otelcollector' self scraper job AND 'kubernetes-pods' scrape job will both scrape
  {{- range $key, $val := .Values.daemonset.annotations }}
    {{ $key }}: {{ $val }}
  {{- end }}

  # Ports to expose per service
  ports:
    - name: prometheus
      protocol: TCP
      port: {{ .Values.daemonset.ports.prometheus.port }}
      targetPort: {{ .Values.daemonset.ports.prometheus.targetPort }}

  # Image
  image: "{{ .Values.daemonset.image.repository }}:{{ include "nrotel.daemonsetImageTag" . }}"
  imagePullPolicy: {{ .Values.daemonset.image.pullPolicy }}

  # Resources
  resources:
    requests:
      cpu: {{ .Values.daemonset.resources.requests.cpu }}
      memory: {{ .Values.daemonset.resources.requests.memory }}
    limits:
      cpu: {{ .Values.daemonset.resources.limits.cpu }}
      memory: {{ .Values.daemonset.resources.limits.memory }}

  # Volumes and volume mounts
  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods

  tolerations:
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  # Environment variables
  env:
    - name: MY_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: MY_POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: MY_POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    {{- range $teamName, $teamInfo := $teams }}
      {{- if ne $teamInfo.ignore true }}
    - name: {{ $teamName }}_endpoint
      value: {{ $teamInfo.endpoint }}
        {{- if $teamInfo.licenseKey.secretRef }}
    - name: {{ $teamName }}_licenseKey
      valueFrom:
        secretKeyRef:
          name: {{ $teamInfo.licenseKey.secretRef.name }}
          key: {{ $teamInfo.licenseKey.secretRef.key }}
        {{- else if $teamInfo.licenseKey.value }}
    - name: {{ $teamName }}_licenseKey
      valueFrom:
        secretKeyRef:
          name: {{ include "nrotel.daemonsetName" $ }}-{{ $teamName }}
          key: licenseKey
        {{- end }}
      {{- end }}
    {{- end }}

  # Otel configuration
  config:
    receivers:
      prometheus/self:
        config:
          scrape_configs:
            - job_name: 'otelcollector'
              scrape_interval: {{ .Values.daemonset.prometheus.self.scrapeInterval }}
              static_configs:
              - targets:
                - 127.0.0.1:{{ .Values.daemonset.ports.prometheus.port }}
              {{- if ne (len .Values.daemonset.prometheus.self.importantMetrics) 0 }}
                {{ $metrics := "" -}}
                {{- range $index, $metric := .Values.daemonset.prometheus.self.importantMetrics -}}
                  {{- if eq $index 0 -}}
                    {{- $metrics = printf "%s" $metric -}}
                  {{ else }}
                    {{- $metrics = printf "%s|%s" $metrics $metric -}}
                  {{- end -}}
                {{- end }}
              metric_relabel_configs:
                - source_labels: [__name__]
                  separator: ;
                  regex: {{ $metrics }}
                  replacement: $$1
                  action: keep
              {{- end }}

      kubeletstats:
        collection_interval: {{ .Values.daemonset.kubeletStats.collectionInterval }}
        auth_type: {{ .Values.daemonset.kubeletStats.authType }}
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        endpoint: "${MY_NODE_NAME}:10250"
        insecure_skip_verify: {{ .Values.daemonset.kubeletStats.insecureSkipVerify }}
        metric_groups: {{ .Values.daemonset.kubeletStats.metricGroups | toYaml | nindent 10 }}

      {{- with .Values.daemonset.filelog }}
      filelog: {{ toYaml . | nindent 8 }}
      {{- end }}

    processors:
      transform/prepare:
        metric_statements:
          - statements:
              # copy service.name to scraper.job to replace filtering functionality
              - set(resource.attributes["scraper.job"], resource.attributes["service.name"])
              # Delete atributes added by prometheus-receiver so that k8sattributes processor can re-add them.
              # See https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/41139
              - delete_key(resource.attributes, "service.name")
              - delete_key(resource.attributes, "service.namespace")
              - delete_key(resource.attributes, "service.version")
              - delete_key(resource.attributes, "service.instance.id")

      transform/kubeletstats_to_cadvisor:
        metric_statements:
          - context: metric
            statements:
            # Transform kubeletstats metric names to cAdvisor-compatible names
            # CPU metrics
            - replace_pattern(name, "^k8s\\.container\\.cpu_time$", "container_cpu_usage_seconds_total")
            - replace_pattern(name, "^k8s\\.node\\.cpu\\.time$", "node_cpu_seconds_total")
            - replace_pattern(name, "^k8s\\.pod\\.cpu\\.time$", "pod_cpu_usage_seconds_total")
            
            # Memory metrics  
            - replace_pattern(name, "^k8s\\.container\\.memory$", "container_memory_usage_bytes")
            - replace_pattern(name, "^k8s\\.container\\.memory_working_set$", "container_memory_working_set_bytes")
            - replace_pattern(name, "^k8s\\.container\\.memory_rss$", "container_memory_rss")
            - replace_pattern(name, "^k8s\\.container\\.memory_cache$", "container_memory_cache")
            - replace_pattern(name, "^k8s\\.container\\.memory_swap$", "container_memory_swap")
            - replace_pattern(name, "^k8s\\.pod\\.memory$", "pod_memory_usage_bytes")
            - replace_pattern(name, "^k8s\\.pod\\.memory_working_set$", "pod_memory_working_set_bytes")
            - replace_pattern(name, "^k8s\\.node\\.memory\\.available$", "node_memory_MemAvailable_bytes")
            - replace_pattern(name, "^k8s\\.node\\.memory\\.total$", "node_memory_MemTotal_bytes")
            
            # Filesystem metrics
            - replace_pattern(name, "^k8s\\.container\\.filesystem\\.reads$", "container_fs_reads_total")
            - replace_pattern(name, "^k8s\\.container\\.filesystem\\.writes$", "container_fs_writes_total")
            - replace_pattern(name, "^k8s\\.container\\.filesystem\\.capacity$", "container_fs_limit_bytes")
            - replace_pattern(name, "^k8s\\.container\\.filesystem\\.usage$", "container_fs_usage_bytes")
            - replace_pattern(name, "^k8s\\.node\\.filesystem\\.available$", "node_filesystem_avail_bytes")
            - replace_pattern(name, "^k8s\\.node\\.filesystem\\.capacity$", "node_filesystem_size_bytes")
            - replace_pattern(name, "^k8s\\.node\\.filesystem\\.usage$", "node_filesystem_usage_bytes")
            
            # Network metrics
            - replace_pattern(name, "^k8s\\.container\\.network\\.rx_bytes$", "container_network_receive_bytes_total")
            - replace_pattern(name, "^k8s\\.container\\.network\\.tx_bytes$", "container_network_transmit_bytes_total")
            - replace_pattern(name, "^k8s\\.container\\.network\\.rx_packets$", "container_network_receive_packets_total")
            - replace_pattern(name, "^k8s\\.container\\.network\\.tx_packets$", "container_network_transmit_packets_total")
            - replace_pattern(name, "^k8s\\.container\\.network\\.rx_errors$", "container_network_receive_errors_total")
            - replace_pattern(name, "^k8s\\.container\\.network\\.tx_errors$", "container_network_transmit_errors_total")
            - replace_pattern(name, "^k8s\\.container\\.network\\.rx_dropped$", "container_network_receive_dropped_total")
            - replace_pattern(name, "^k8s\\.container\\.network\\.tx_dropped$", "container_network_transmit_dropped_total")
            
            # Volume metrics
            - replace_pattern(name, "^k8s\\.volume\\.capacity$", "container_fs_limit_bytes")
            - replace_pattern(name, "^k8s\\.volume\\.available$", "container_fs_usage_bytes")
            - replace_pattern(name, "^k8s\\.volume\\.inodes$", "container_fs_inodes_total")
            - replace_pattern(name, "^k8s\\.volume\\.inodes_free$", "container_fs_inodes_free")
            
          - context: resource
            statements:
            # Set service.name to match cAdvisor job name for backward compatibility
            - set(attributes["service.name"], "kubernetes-nodes-cadvisor")
            # Ensure proper attribute mapping for cAdvisor compatibility
            - set(attributes["job"], "kubernetes-nodes-cadvisor") where attributes["service.name"] == "kubernetes-nodes-cadvisor"

      k8sattributes:
        extract:
          metadata:
          - k8s.namespace.name
          - k8s.deployment.name
          - k8s.statefulset.name
          - k8s.daemonset.name
          - k8s.cronjob.name
          - k8s.job.name
          - k8s.node.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.pod.start_time
          - service.namespace
          - service.name
          - service.version
          - service.instance.id
          {{- with .Values.daemonset.processors.k8sattributes.labels }}
          labels: {{ toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.daemonset.processors.k8sattributes.annotations }}
          annotations: {{ toYaml . | nindent 12 }}
          {{- end }}

        passthrough: false
        pod_association:
        - sources:
          - from: resource_attribute
            name: k8s.pod.ip
        - sources:
          - from: resource_attribute
            name: k8s.pod.uid
        - sources:
          - from: connection

      attributes:
        actions:
          - key: k8s.cluster.name
            value: {{ .Values.clusterName }}
            action: upsert
      attributes/self:
        actions:
          - key: otelcollector.type
            value: daemonset
            action: upsert
          - key: k8s.node.name
            value: ${MY_NODE_NAME}
            action: upsert
          - key: k8s.namespace.name
            value: ${MY_POD_NAMESPACE}
            action: upsert
          - key: k8s.pod.name
            value: ${MY_POD_NAME}
            action: upsert

      {{- range $teamName, $teamInfo := $teams }}
        {{- if and (ne $teamInfo.ignore true) (ne (len $teamInfo.namespaces) 0) }}
      filter/{{ $teamName }}:
        error_mode: ignore
        logs:
          log_record:
            - {{ $teamInfo.filter }}
        {{- end }}
      {{- end }}

      {{- if ne (len .Values.daemonset.kubeletStats.importantMetrics) 0 }}
      filter/kubeletstats_original:
        error_mode: ignore
        metrics:
          metric:
            # Filter for original kubeletstats format - drop metrics NOT matching the important list (keep only important ones)
            - not IsMatch(name, "^({{- range $index, $metric := .Values.daemonset.kubeletStats.importantMetrics -}}{{- if ne $index 0 }}|{{ end }}{{ $metric | replace "." "\." | replace "*" ".*" }}{{- end }})$")
      {{- end }}

      {{- if ne (len .Values.daemonset.kubeletStats.importantMetricsCadvisor) 0 }}
      filter/kubeletstats_cadvisor:
        error_mode: ignore
        metrics:
          metric:
            # Filter for cAdvisor format - drop metrics NOT matching the important list (keep only important ones)
            - not IsMatch(name, "^({{- range $index, $metric := .Values.daemonset.kubeletStats.importantMetricsCadvisor -}}{{- if ne $index 0 }}|{{ end }}{{ $metric | replace "." "\." | replace "*" ".*" }}{{- end }})$")
      {{- end }}

      memory_limiter:
         check_interval: 1s
         limit_percentage: 80
         spike_limit_percentage: 25

      batch:
        send_batch_max_size: 1000
        timeout: 30s
        send_batch_size : 800

    exporters:
    
      {{- range $teamName, $teamInfo := $teams }}
        {{- if ne $teamInfo.ignore true }}
      otlphttp/{{ $teamName }}:
        endpoint: {{ "${" }}{{ $teamName }}_endpoint}
        tls:
          insecure: false
        headers:
          api-key: {{ "${" }}{{ $teamName }}_licenseKey}
        {{- end }}
      {{- end }}

      debug:
        verbosity: detailed

    service:

      pipelines:
        metrics/self:
          receivers:
            - prometheus/self
          processors:
            - memory_limiter
            - transform/prepare
            - k8sattributes
            - attributes
            - attributes/self
            - batch
          exporters:
            - otlphttp/opsteam
            # - logging

        metrics/kubeletstats:
          receivers:
            - kubeletstats
          processors:
            - memory_limiter
            - k8sattributes
            - attributes
          {{- if ne (len .Values.daemonset.kubeletStats.importantMetrics) 0 }}
            - filter/kubeletstats_original
          {{- end }}
            - batch
          exporters:
            - otlphttp/opsteam
            # - logging


        metrics/kubeletstats_cadvisor:
          receivers:
            - kubeletstats
          processors:
            - memory_limiter
            - transform/kubeletstats_to_cadvisor
            - k8sattributes
            - attributes
          {{- if ne (len .Values.daemonset.kubeletStats.importantMetricsCadvisor) 0 }}
            - filter/kubeletstats_cadvisor
          {{- end }}
            - batch
          exporters:
            - otlphttp/opsteam
            # - logging


        {{- range $teamName, $teamInfo := $teams }}
          {{- if ne $teamInfo.ignore true }}
        logs/{{ $teamName }}:
          receivers:
            - filelog
          processors:
            - memory_limiter
            - k8sattributes
            - attributes
          {{- if ne (len $teamInfo.namespaces) 0 }}
            - filter/{{ $teamName }}
          {{- end }}
            - batch
          exporters:
            - otlphttp/{{ $teamName }}
            # - logging
          {{- end }}
        {{- end }}

{{- end -}}
