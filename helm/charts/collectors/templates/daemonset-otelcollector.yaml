{{- if eq .Values.daemonset.enabled true -}}
{{- $teams := include "daemonsetTeamConfig" . | fromYaml }}
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: {{ include "nrotel.daemonsetName" . }}
  namespace: {{ .Release.Namespace }}
spec:

  # Mode
  mode: "daemonset"

  # Service Account
  serviceAccount: {{ include "nrotel.daemonsetName" . }}

  # Security context for container priviliges
  {{- with .Values.daemonset.securityContext }}
  securityContext: {{ toYaml . | nindent 4 }}
  {{- end }}

  # Annotations for the pods
  podAnnotations:
    prometheus.io/scrape: "false" # This should be false by default. Otherwise 'otelcollector' self scraper job AND 'kubernetes-pods' scrape job will both scrape
  {{- range $key, $val := .Values.daemonset.annotations }}
    {{ $key }}: {{ $val }}
  {{- end }}

  # Ports to expose per service
  ports:
    - name: prometheus
      protocol: TCP
      port: {{ .Values.daemonset.ports.prometheus.port }}
      targetPort: {{ .Values.daemonset.ports.prometheus.targetPort }}

  # Image
  image: "{{ .Values.daemonset.image.repository }}:{{ include "nrotel.daemonsetImageTag" . }}"
  imagePullPolicy: {{ .Values.daemonset.image.pullPolicy }}

  # Resources
  resources:
    requests:
      cpu: {{ .Values.daemonset.resources.requests.cpu }}
      memory: {{ .Values.daemonset.resources.requests.memory }}
    limits:
      cpu: {{ .Values.daemonset.resources.limits.cpu }}
      memory: {{ .Values.daemonset.resources.limits.memory }}

  # Volumes and volume mounts
  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods

  tolerations:
    {{- toYaml .Values.daemonset.tolerations | nindent 4 }}

  # Environment variables
  env:
    - name: MY_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: MY_POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: MY_POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    {{- range $teamName, $teamInfo := $teams }}
      {{- if ne $teamInfo.ignore true }}
    - name: {{ $teamName }}_endpoint
      value: {{ $teamInfo.endpoint }}
        {{- if $teamInfo.licenseKey.secretRef }}
    - name: {{ $teamName }}_licenseKey
      valueFrom:
        secretKeyRef:
          name: {{ $teamInfo.licenseKey.secretRef.name }}
          key: {{ $teamInfo.licenseKey.secretRef.key }}
        {{- else if $teamInfo.licenseKey.value }}
    - name: {{ $teamName }}_licenseKey
      valueFrom:
        secretKeyRef:
          name: {{ include "nrotel.daemonsetName" $ }}-{{ $teamName }}
          key: licenseKey
        {{- end }}
      {{- end }}
    {{- end }}

  # Otel configuration
  config:
    receivers:
      prometheus/self:
        config:
          scrape_configs:
            - job_name: 'otelcollector'
              scrape_interval: {{ .Values.daemonset.prometheus.self.scrapeInterval }}
              static_configs:
              - targets:
                - 127.0.0.1:{{ .Values.daemonset.ports.prometheus.port }}
              {{- if ne (len .Values.daemonset.prometheus.self.importantMetrics) 0 }}
                {{ $metrics := "" -}}
                {{- range $index, $metric := .Values.daemonset.prometheus.self.importantMetrics -}}
                  {{- if eq $index 0 -}}
                    {{- $metrics = printf "%s" $metric -}}
                  {{ else }}
                    {{- $metrics = printf "%s|%s" $metrics $metric -}}
                  {{- end -}}
                {{- end }}
              metric_relabel_configs:
                - source_labels: [__name__]
                  separator: ;
                  regex: {{ $metrics }}
                  replacement: $$1
                  action: keep
              {{- end }}
        
      prometheus:
        config:
          scrape_configs:
            - job_name: 'kubernetes-nodes-cadvisor'
              scrape_interval: {{ .Values.daemonset.prometheus.cAdvisor.scrapeInterval }}
              scrape_timeout: {{ .Values.daemonset.prometheus.cAdvisor.scrapeTimeout }}
              scheme: https
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                insecure_skip_verify: true
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              kubernetes_sd_configs:
                - role: node
              relabel_configs:
                - replacement: kubernetes.default.svc.cluster.local:443
                  target_label: __address__
                - regex: (.+)
                  replacement: /api/v1/nodes/$${1}/proxy/metrics/cadvisor
                  source_labels:
                    - __meta_kubernetes_node_name
                  target_label: __metrics_path__
                - action: replace
                  target_label: job_label
                  replacement: cadvisor
                - source_labels: [__meta_kubernetes_node_name]
                  regex: ${MY_NODE_NAME}
                  action: keep
              metric_relabel_configs:
              {{- if ne (len .Values.daemonset.prometheus.cAdvisor.importantMetrics) 0 }}
                {{ $metrics := "" -}}
                {{- range $index, $metric := .Values.daemonset.prometheus.cAdvisor.importantMetrics -}}
                  {{- if eq $index 0 -}}
                    {{- $metrics = printf "%s" $metric -}}
                  {{ else }}
                    {{- $metrics = printf "%s|%s" $metrics $metric -}}
                  {{- end -}}
                {{- end }}
                - source_labels: [__name__]
                  separator: ;
                  regex: {{ $metrics }}
                  replacement: $$1
                  action: keep
              {{- end }}
                # Init temporary label is_network_metric for all metrics
                - source_labels: [__name__]
                  regex: '.*'
                  target_label: "is_network_metric"
                  replacement: "false"
                - source_labels: [__name__]
                  regex: '^container_network_.*'
                  target_label: "is_network_metric"
                  replacement: "true"

                # Drop metrics without container/image/name for non-network metrics
                - source_labels: [is_network_metric, container]
                  regex: '^false;$'
                  action: drop
                - source_labels: [is_network_metric, image]
                  regex: '^false;$'
                  action: drop
                - source_labels: [is_network_metric, name]
                  regex: '^false;$'
                  action: drop

                # Remove temporary label
                - regex: 'is_network_metric'
                  action: labeldrop
      kubelet_stats:
        collection_interval: {{ .Values.daemonset.kubeletStats.collectionInterval }}
        timeout: {{ .Values.daemonset.kubeletStats.timeout }}
        auth_type: {{ .Values.daemonset.kubeletStats.authType }}
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        endpoint: "${MY_NODE_NAME}:10250"
        insecure_skip_verify: {{ .Values.daemonset.kubeletStats.insecureSkipVerify }}
        metric_groups: {{ .Values.daemonset.kubeletStats.metricGroups | toYaml | nindent 10 }}
        metrics:
          k8s.container.cpu_limit_utilization:
            enabled: true
          k8s.pod.cpu_limit_utilization:
            enabled: true
          k8s.pod.cpu_request_utilization:
            enabled: true
          k8s.pod.memory_limit_utilization:
            enabled: true
          k8s.pod.memory_request_utilization:
            enabled: true
          k8s.pod.volume.usage:
            enabled: true

      {{- with .Values.daemonset.filelog }}
      filelog: {{ toYaml . | nindent 8 }}
      {{- end }}

    processors:
      resourcedetection:
        detectors: [env, azure]
        azure:
          resource_attributes:
            cloud.provider:
              enabled: true
            cloud.platform:
              enabled: false
            cloud.region:
              enabled: true
            cloud.account.id:
              enabled: false
            host.id:
              enabled: false
            host.name:
              enabled: false
            azure.vm.name:
              enabled: false
            azure.vm.size:
              enabled: true
            azure.vm.scaleset.name:
              enabled: false
            azure.resourcegroup.name:
              enabled: false
      groupbyattrs:
        keys:
          - pod
          - uid
          - container
          - daemonset
          - replicaset
          - statefulset
          - deployment
          - cronjob
          - configmap
          - job
          - job_name
          - horizontalpodautoscaler
          - persistentvolume
          - persistentvolumeclaim
          - endpoint
          - mutatingwebhookconfiguration
          - validatingwebhookconfiguration
          - lease
          - storageclass
          - secret
          - service
          - resourcequota
          - node
          - namespace
      transform/ksm:
        metric_statements:
          - delete_key(resource.attributes, "k8s.node.name")
          - delete_key(resource.attributes, "k8s.namespace.name")
          - delete_key(resource.attributes, "k8s.pod.uid")
          - delete_key(resource.attributes, "k8s.pod.name")
          - delete_key(resource.attributes, "k8s.container.name")
          - delete_key(resource.attributes, "k8s.replicaset.name")
          - delete_key(resource.attributes, "k8s.deployment.name")
          - delete_key(resource.attributes, "k8s.statefulset.name")
          - delete_key(resource.attributes, "k8s.daemonset.name")
          - delete_key(resource.attributes, "k8s.job.name")
          - delete_key(resource.attributes, "k8s.cronjob.name")
          - delete_key(resource.attributes, "k8s.replicationcontroller.name")
          - delete_key(resource.attributes, "k8s.hpa.name")
          - delete_key(resource.attributes, "k8s.resourcequota.name")
          - delete_key(resource.attributes, "k8s.volume.name")
          - set(resource.attributes["k8s.pod.uid"], resource.attributes["uid"])
          - set(resource.attributes["k8s.node.name"], resource.attributes["node"])
          - set(resource.attributes["k8s.namespace.name"], resource.attributes["namespace"])
          - set(resource.attributes["k8s.pod.name"], resource.attributes["pod"])
          - set(resource.attributes["k8s.container.name"], resource.attributes["container"])
          - set(resource.attributes["k8s.replicaset.name"], resource.attributes["replicaset"])
          - set(resource.attributes["k8s.deployment.name"], resource.attributes["deployment"])
          - set(resource.attributes["k8s.statefulset.name"], resource.attributes["statefulset"])
          - set(resource.attributes["k8s.daemonset.name"], resource.attributes["daemonset"])
          - set(resource.attributes["k8s.job.name"], resource.attributes["job_name"])
          - set(resource.attributes["k8s.cronjob.name"], resource.attributes["cronjob"])
          - set(resource.attributes["k8s.replicationcontroller.name"], resource.attributes["replicationcontroller"])
          - set(resource.attributes["k8s.hpa.name"], resource.attributes["horizontalpodautoscaler"])
          - set(resource.attributes["k8s.resourcequota.name"], resource.attributes["resourcequota"])
          - set(resource.attributes["k8s.volume.name"], resource.attributes["volumename"])
          - set(resource.attributes["k8s.volume.name"], resource.attributes["persistentvolume"])
          - set(resource.attributes["k8s.pvc.name"], resource.attributes["persistentvolumeclaim"])
          # FIXME: those are mandatory for the current dashboards
          #- delete_key(resource.attributes, "uid")
          #- delete_key(resource.attributes, "node")
          #- delete_key(resource.attributes, "namespace")
          #- delete_key(resource.attributes, "pod")
          #- delete_key(resource.attributes, "container")
          #- delete_key(resource.attributes, "replicaset")
          #- delete_key(resource.attributes, "deployment")
          #- delete_key(resource.attributes, "statefulset")
          #- delete_key(resource.attributes, "daemonset")
          #- delete_key(resource.attributes, "job_name")
          #- delete_key(resource.attributes, "cronjob")
          #- delete_key(resource.attributes, "replicationcontroller")
          #- delete_key(resource.attributes, "horizontalpodautoscaler")
          #- delete_key(resource.attributes, "resourcequota")
          #- delete_key(resource.attributes, "volumename")
          #- delete_key(resource.attributes, "persistentvolume")
          #- delete_key(resource.attributes, "persistentvolumeclaim")
      transform/prepare:
        metric_statements:
          #- context: datapoint
          #  statements:
          #    - set(resource.attributes["k8s.pod.name"], attributes["pod"]) where attributes["pod"] != nil
          #    - set(resource.attributes["k8s.namespace.name"], attributes["namespace"]) where attributes["namespace"] != nil
          #    - set(resource.attributes["k8s.container.name"], attributes["container"]) where attributes["container"] != nil
          - statements:
              # copy service.name to scraper.job to replace filtering
              - set(resource.attributes["scraper.job"], resource.attributes["service.name"])
              # Delete attributes added by prometheus-receiver so that k8s_attributes processor can re-add them.
              # See https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/41139
              - delete_key(resource.attributes, "service.name")
              - delete_key(resource.attributes, "service.namespace")
              - delete_key(resource.attributes, "service.version")
              - delete_key(resource.attributes, "service.instance.id")

      k8s_attributes:
        extract:
          metadata:
          - k8s.namespace.name
          - k8s.deployment.name
          - k8s.statefulset.name
          - k8s.daemonset.name
          - k8s.cronjob.name
          - k8s.job.name
          - k8s.node.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.pod.start_time
          - service.namespace
          - service.name
          - service.version
          - service.instance.id
          {{- with .Values.daemonset.processors.k8sattributes.labels }}
          labels: {{ toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.daemonset.processors.k8sattributes.annotations }}
          annotations: {{ toYaml . | nindent 12 }}
          {{- end }}
        passthrough: false
        pod_association:
        - sources:
          - from: resource_attribute
            name: k8s.pod.ip
        - sources:
          - from: resource_attribute
            name: k8s.pod.uid
        - sources:
          - from: connection
      cumulativetodelta: {}

      k8s_attributes/ksm:
        # Metadata attached by this processor is reliant on the uid & pod name. This would be sufficient for most types
        # of metrics but there are cases of metrics where a uid would not be present and thus metadata would
        # not be attached. To address cases like these, metadata attributes must be annotated in a different manner
        # such as by preserving some of the attributes presented by KSM.
        auth_type: "serviceAccount"
        passthrough: false
        filter:
          node_from_env_var: MY_NODE_NAME
        extract:
          metadata:
            - k8s.deployment.name
            - k8s.daemonset.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.pod.start_time
            - k8s.replicaset.name
            - k8s.statefulset.name
            - k8s.cronjob.name
            - k8s.job.name
            - service.namespace
            - service.name
            - service.version
            - service.instance.id

          {{- with .Values.daemonset.processors.k8sattributes.labels }}
          labels: {{ toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.daemonset.processors.k8sattributes.annotations }}
          annotations: {{ toYaml . | nindent 12 }}
          {{- end }}
        pod_association:
          - sources:
            - from: resource_attribute
              name: k8s.pod.uid
          - sources:
            - from: resource_attribute
              name: k8s.pod.name
      attributes:
        actions:
          - key: k8s.cluster.name
            value: {{ .Values.clusterName }}
            action: upsert
      resource:
        attributes:
          - key: vm.type
            action: upsert
            from_attribute: azure.vm.size
          - key: azure.vm.size
            action: delete
      attributes/self:
        actions:
          - key: otelcollector.type
            value: daemonset
            action: upsert
          - key: k8s.node.name
            value: ${MY_NODE_NAME}
            action: upsert
          - key: k8s.namespace.name
            value: ${MY_POD_NAMESPACE}
            action: upsert
          - key: k8s.pod.name
            value: ${MY_POD_NAME}
            action: upsert
      batch:
        send_batch_max_size: 1000
        timeout: 30s
        send_batch_size : 800

      {{- if ne (len .Values.daemonset.kubeletStats.importantMetrics) 0 }}
      filter/kubelet_stats_metrics:
        error_mode: ignore
        metrics:
          metric:
            - not (IsMatch(name, "^({{- range $i, $m := .Values.daemonset.kubeletStats.importantMetrics -}}{{ if ne $i 0 }}|{{ end }}{{ $m | replace "." "\\\\." | replace "*" ".*" }}{{- end }})$"))
      {{- end }}

      memory_limiter:
         check_interval: 1s
         limit_percentage: 80
         spike_limit_percentage: 25

    connectors:
      routing/metrics:
        # ???
        #default_pipelines: []
        table:
      {{- range $teamName, $teamInfo := $teams }}
        {{- if and (ne $teamInfo.ignore true) (ne (len $teamInfo.namespaces) 0) }}
          - context: metric
            condition: {{ $teamInfo.filter }}
            pipelines:
              - metrics/{{ $teamName }}
        {{- end }}
      {{- end }}
      routing/logs:
        # ???
        #default_pipelines: []
        table:
      {{- range $teamName, $teamInfo := $teams }}
        {{- if and (ne $teamInfo.ignore true) (ne (len $teamInfo.namespaces) 0) }}
          - context: log
            condition: {{ $teamInfo.filter }}
            pipelines:
              - logs/{{ $teamName }}
        {{- end }}
      {{- end }}

    exporters:
    
      {{- range $teamName, $teamInfo := $teams }}
        {{- if ne $teamInfo.ignore true }}
      otlp_http/{{ $teamName }}:
        endpoint: {{ "${" }}{{ $teamName }}_endpoint}
        tls:
          insecure: false
        headers:
          api-key: {{ "${" }}{{ $teamName }}_licenseKey}
        {{- end }}
      {{- end }}

      debug:
        verbosity: detailed

    service:

      pipelines:
        metrics/self:
          receivers:
            - prometheus/self
          processors:
            - memory_limiter
            - transform/prepare
            - k8s_attributes
            - attributes
            - attributes/self
            - batch
          exporters:
            - otlp_http/opsteam
            # - logging

        metrics/ingest:
          receivers:
            - prometheus
          processors:
            - memory_limiter
            - resourcedetection
            - transform/prepare
            - groupbyattrs
            - transform/ksm
            - k8s_attributes/ksm
            - attributes
            - cumulativetodelta
          exporters:
            - routing/metrics
        metrics/kubelet_stats_ingest:
          receivers:
            - kubelet_stats
          processors:
            - memory_limiter
            - resourcedetection
            - k8s_attributes
            - attributes
            - resource
          {{- if ne (len $.Values.daemonset.kubeletStats.importantMetrics) 0 }}
            - filter/kubelet_stats_metrics
          {{- end }}
          exporters:
            - routing/metrics

        logs/ingest:
          receivers: 
            - filelog
          processors:
            - memory_limiter
            - k8s_attributes
            - attributes
          exporters:
            - routing/logs

        {{- range $teamName, $teamInfo := $teams }}
          {{- if ne $teamInfo.ignore true }}
        metrics/{{ $teamName }}:
          receivers:
            - routing/metrics
          processors:
            - batch
          exporters:
            - otlp_http/{{ $teamName }}
            # - logging
        logs/{{ $teamName }}:
          receivers:
            - routing/logs
          processors:
            - batch
          exporters:
            - otlp_http/{{ $teamName }}
            # - logging
          {{- end }}
        {{- end }}

{{- end -}}
